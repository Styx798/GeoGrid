[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geogrid"
version = "0.1.0"
description = "Local image-grid review application."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pillow==12.3.0",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
geogrid = "geogrid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geogrid = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
